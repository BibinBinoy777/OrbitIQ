name: OrbitIQ checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retain_release_images:
        description: Retain this verified private CI candidate's image bytes for 90 days (no deployment)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Audit locked Python dependencies (advisory lookup, not OS assurance)
        run: |
          uv export --locked --format requirements-txt --no-hashes --output-file "${{ runner.temp }}/requirements.txt"
          uvx --from pip-audit==2.9.0 pip-audit --strict --no-deps --disable-pip --cache-dir "${{ runner.temp }}/pip-audit" -r "${{ runner.temp }}/requirements.txt" --format json --output "${{ runner.temp }}/python-advisories.json"
      - run: uv run --locked pytest --junitxml="${{ runner.temp }}/backend-tests.xml"
      - name: Published SGP4 reference audit
        run: PYTHONPATH=backend uv run --locked python scripts/verify_scientific_references.py --output "${{ runner.temp }}/sgp4-results.json"
      - name: Terrestrial transformation reference audit
        run: PYTHONPATH=backend uv run --locked python scripts/verify_earth_fixed_references.py --output "${{ runner.temp }}/earth-fixed-results.json"
      - name: Expanded scientific and geodetic regressions
        run: |
          PYTHONPATH=backend uv run --locked python scripts/verify_phase61_science.py --output "${{ runner.temp }}/phase61-results.json"
          PYTHONPATH=backend uv run --locked python scripts/verify_phase611_geodesy.py --output "${{ runner.temp }}/geodesy-results.json"
      - name: Explicit schema migration and separate restore checks
        run: uv run --locked pytest -q backend/tests/test_phase6_collection.py -k "migration or restore or backup"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: E3 isolated checkout, locked installs and failure recovery
        run: python3 scripts/verify_fresh_checkout.py --output "${{ runner.temp }}/orbitiq-e3"
      - name: Preserve fixture-only installation and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-checkout-recovery
          path: |
            ${{ runner.temp }}/orbitiq-e3/summary.json
            ${{ runner.temp }}/orbitiq-e3/failure.json
            ${{ runner.temp }}/orbitiq-e3/*.log
            ${{ runner.temp }}/orbitiq-e3/recovery/verification.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-advisories
          path: ${{ runner.temp }}/python-advisories.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve bounded backend verification results (not raw databases)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-verification
          path: |
            ${{ runner.temp }}/backend-tests.xml
            ${{ runner.temp }}/sgp4-results.json
            ${{ runner.temp }}/earth-fixed-results.json
            ${{ runner.temp }}/phase61-results.json
            ${{ runner.temp }}/geodesy-results.json
            ${{ runner.temp }}/orbitiq-e3/summary.json
            ${{ runner.temp }}/orbitiq-e3/recovery/verification.json
          if-no-files-found: warn
          retention-days: 90
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit locked frontend dependencies
        run: npm audit --audit-level=high --json > "${{ runner.temp }}/npm-advisories.json"
      - run: npm test -- --reporter=default --reporter=junit --outputFile.junit="${{ runner.temp }}/frontend-tests.xml"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-advisories
          path: ${{ runner.temp }}/npm-advisories.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          path: ${{ runner.temp }}/frontend-tests.xml
          if-no-files-found: warn
          retention-days: 90
  release-images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist
      - name: Build locked release targets (local only; no registry publication)
        run: |
          docker build --build-arg ORBITIQ_SOURCE_REVISION="$GITHUB_SHA" --build-arg ORBITIQ_SOURCE_TREE="$(git rev-parse HEAD^{tree})" --target api -t orbitiq-api:ci .
          docker build --build-arg ORBITIQ_SOURCE_REVISION="$GITHUB_SHA" --build-arg ORBITIQ_SOURCE_TREE="$(git rev-parse HEAD^{tree})" --target web -t orbitiq-web:ci .
      - name: Capture source, locks, image IDs and exact frontend artifact before tests
        run: |
          mkdir -p "${{ runner.temp }}/orbitiq-release"
          python3 scripts/verify_release_evidence.py capture --release ci --frontend "${{ runner.temp }}/frontend-dist" --output "${{ runner.temp }}/orbitiq-release/capture.json"
      - name: Validate static gateway configuration
        run: docker run --rm --network none orbitiq-web:ci nginx -t
      - name: Start release images against a separate empty fixture and verify APIs
        run: python3 scripts/verify_release_containers.py --release ci --tls --output "${{ runner.temp }}/orbitiq-release/proxy.json"
      - name: Install PDF text inspection tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Build existing pinned Playwright runtime
        run: docker build -f deploy/Dockerfile.browser -t orbitiq-browser:e1 .
      - name: E1 regressions, E2 accessibility and performance, seven PDFs
        run: python3 scripts/run_browser_regressions.py --release ci --engineering-e2 --output "${{ runner.temp }}/orbitiq-release/browser"
      - name: Refuse changed images, source or artifacts and seal verification record
        run: |
          python3 scripts/verify_release_evidence.py seal --capture "${{ runner.temp }}/orbitiq-release/capture.json" --frontend "${{ runner.temp }}/frontend-dist" --directory "${{ runner.temp }}/orbitiq-release" --output "${{ runner.temp }}/orbitiq-release/verified-release.json"
          python3 scripts/verify_release_evidence.py verify-files --record "${{ runner.temp }}/orbitiq-release/verified-release.json" --directory "${{ runner.temp }}/orbitiq-release" --frontend "${{ runner.temp }}/frontend-dist"
      - name: Select compact sealed evidence for longer retention
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root = Path("${{ runner.temp }}/orbitiq-release")
          output = Path("${{ runner.temp }}/orbitiq-release-evidence")
          output.mkdir()
          record = json.loads((root / "verified-release.json").read_text())
          for name in [*record["evidence_sha256"], record["capture_name"], "verified-release.json"]:
              source, target = root / name, output / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY
          python3 scripts/verify_release_evidence.py verify-files --record "${{ runner.temp }}/orbitiq-release-evidence/verified-release.json" --directory "${{ runner.temp }}/orbitiq-release-evidence" --frontend "${{ runner.temp }}/frontend-dist"
      - name: Retain selected verified image bytes without registry publication
        if: github.event_name == 'workflow_dispatch' && inputs.retain_release_images
        run: |
          python3 scripts/verify_retained_candidate.py pack --record "${{ runner.temp }}/orbitiq-release/verified-release.json" --directory "${{ runner.temp }}/orbitiq-release" --frontend "${{ runner.temp }}/frontend-dist" --output "${{ runner.temp }}/orbitiq-candidate"
          python3 scripts/verify_retained_candidate.py verify --directory "${{ runner.temp }}/orbitiq-candidate" --revision "$GITHUB_SHA"
      - name: Upload selected private CI candidate (no release or deployment)
        if: github.event_name == 'workflow_dispatch' && inputs.retain_release_images
        uses: actions/upload-artifact@v4
        with:
          name: retained-candidate
          path: ${{ runner.temp }}/orbitiq-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve compact sealed evidence beyond diagnostic expiry
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: ${{ runner.temp }}/orbitiq-release-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Preserve fixture-only browser and PDF diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pdf-regressions
          path: ${{ runner.temp }}/orbitiq-release/browser
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve release identity and artifact checksums (no image registry publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: ${{ runner.temp }}/orbitiq-release/*.json
          if-no-files-found: warn
          retention-days: 7
