name: OrbitIQ checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run --locked pytest
      - name: Published SGP4 reference audit
        run: PYTHONPATH=backend uv run --locked python scripts/verify_scientific_references.py --output /tmp/sgp4-results.json
      - name: Terrestrial transformation reference audit
        run: PYTHONPATH=backend uv run --locked python scripts/verify_earth_fixed_references.py --output /tmp/earth-fixed-results.json
      - name: Explicit schema migration and separate restore checks
        run: uv run --locked pytest -q backend/tests/test_phase6_collection.py -k "migration or restore or backup"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
