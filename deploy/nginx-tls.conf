# Optional local/staging TLS termination. Certificates are operator-provisioned.
# This file is mounted only by compose.tls.yaml; no automatic issuance or DNS.
server {
    listen 8443 ssl;
    ssl_certificate /run/orbitiq-tls/fullchain.pem;
    ssl_certificate_key /run/orbitiq-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_timeout 10m;
    include /etc/nginx/server-routes.conf;
}
