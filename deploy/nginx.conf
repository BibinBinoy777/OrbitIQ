worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Deliberately exclude URLs, queries, IPs, referrers, cookies and headers.
    map $request_method $safe_method {
        default OTHER;
        GET GET; HEAD HEAD; OPTIONS OPTIONS; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE;
    }
    log_format operational escape=json '{"event":"edge_request","at":"$time_iso8601","request_id":"$upstream_http_x_request_id","method":"$safe_method","status":$status,"duration_seconds":$request_time,"response_bytes":$body_bytes_sent}';
    access_log /dev/stdout operational;
    limit_req_zone $binary_remote_addr zone=public_reads:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=calculations:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=clients:10m;
    limit_req_status 429;
    limit_conn_status 429;
    keepalive_timeout 10s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    client_max_body_size 1k;
    large_client_header_buffers 2 8k;
    map $https $hsts_value { default ""; on "max-age=3600"; }
    include /etc/nginx/tls-enabled/*.conf;
    server {
        listen 8080;
        include /etc/nginx/server-routes.conf;
    }
}
