root /usr/share/nginx/html;
index index.html;
limit_conn clients 16;
include /etc/nginx/security-headers.conf;
error_page 429 = @busy;
location @busy {
    include /etc/nginx/security-headers.conf;
    add_header Retry-After 1 always;
    default_type application/json;
    return 429 '{"error":{"code":"rate_limited","message":"Request rate exceeded; retry later"}}';
}
location ~ "^/api/(observation-validations/[a-f0-9]{32}|historical-analysis|comparisons|investigation-reports|snapshots/[0-9]+/(position|earth-fixed)|satellites/[0-9]+/ground-track)/?$" {
    limit_req zone=calculations burst=6 nodelay;
    include /etc/nginx/api-proxy.conf;
}
location /api/ {
    limit_req zone=public_reads burst=60 nodelay;
    include /etc/nginx/api-proxy.conf;
}
location /assets/ {
    expires 1h;
    try_files $uri =404;
}
location = /index.html { expires -1; }
location ~ /\. { return 404; }
location / { try_files $uri $uri/ /index.html; }
